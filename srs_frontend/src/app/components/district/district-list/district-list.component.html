<div class="page">
  <div class="page-header">
    <h1>Districts</h1>
    <button class="btn-primary" (click)="openForm()">+ Add District</button>
  </div>

  <div class="filter-bar">
    <label>Filter by City
      <select [formControl]="filterCityControl" (change)="applyCityFilter()">
        <option [value]="0">All Cities</option>
        <ng-container *ngFor="let city of cities">
          <option [value]="city.id">{{ city.cityName }}</option>
        </ng-container>
      </select>
    </label>
  </div>

  <ng-container *ngIf="showForm">
    <div class="form-card" [formGroup]="districtForm">
      <h3>New District</h3>
      <label>District Name
        <input type="text" formControlName="districtName" placeholder="District name" />
      </label>
      <label>City
        <select formControlName="cityId">
          <option [value]="0" disabled>Select a city</option>
          <ng-container *ngFor="let city of cities">
            <option [value]="city.id">{{ city.cityName }}</option>
          </ng-container>
        </select>
      </label>
      <label>Postal Code
        <input type="text" formControlName="postalCode" placeholder="Postal code" />
      </label>
      <div class="form-actions">
        <button class="btn-primary" (click)="saveDistrict()" [disabled]="saving || districtForm.invalid">Save</button>
        <button class="btn-secondary" (click)="cancelForm()">Cancel</button>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="error"> <div class="alert alert-danger">{{ error }}</div> </ng-container>
  <ng-container *ngIf="loading"> <div class="loading">Loading...</div> </ng-container>

  <ng-container *ngIf="!loading">
    <table class="data-table">
      <caption class="visually-hidden">Districts list with IDs, city details, postal codes, and available actions.</caption>
      <thead>
        <tr>
          <th>ID</th>
          <th>District Name</th>
          <th>City</th>
          <th>Postal Code</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let d of pagedDistricts">
            <td>{{ d.id }}</td>
            <td>{{ d.districtName }}</td>
            <td>{{ d.cityName }}</td>
            <td>{{ d.postalCode }}</td>
            <td>
              <button class="btn-danger btn-sm" (click)="deleteDistrict(d.id, d.districtName)">Delete</button>
            </td>
        </tr>
        <tr *ngIf="pagedDistricts.length === 0"><td colspan="5" class="empty">No districts found.</td></tr>
      </tbody>
    </table>

    <div class="pagination-bar">
      <label>Page Size
        <select [formControl]="pageSizeControl" (change)="changePageSize()">
          <ng-container *ngFor="let size of pageSizeOptions">
            <option [value]="size">{{ size }}</option>
          </ng-container>
        </select>
      </label>
      <button class="btn-secondary btn-sm" (click)="goToPage(currentPage - 1)" [disabled]="currentPage <= 1">Previous</button>
      <span>Page {{ currentPage }} of {{ totalPages }}</span>
      <button class="btn-secondary btn-sm" (click)="goToPage(currentPage + 1)" [disabled]="currentPage >= totalPages">Next</button>
    </div>
  </ng-container>
</div>
